<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>臺灣太空產業價值鏈地圖 — Taiwan Space Industry Value Chain Map</title>
<meta name="description" content="以互動地圖呈現臺灣衛星、火箭與太空產業價值鏈:研究機構、火箭發射、衛星製造、地面設備與應用服務的地理聚落。中英文雙語。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%2335D0A0'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Space+Grotesk:wght@300;400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  :root {
    --bg: #262624; --bg-2: #30302E; --bg-3: #3A3936;
    --border: #464540; --border-soft: #3B3A37;
    --text: #ECEAE5; --text-2: #CBC8C1; --text-3: #ABA79E; --muted: #8F8C84;
    --blue: #4C74D9; --cyan: #6FD4FF; --cyan-2: #A8E6FF;
    --gold: #FFC53D; --coral: #FF7A5C; --green: #35D0A0;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { font-family: 'Noto Sans TC', 'Space Grotesk', sans-serif; color: var(--text); line-height: 1.85; }
  a { color: var(--cyan); text-decoration: none; }
  a:hover { color: var(--cyan-2); text-decoration: underline; }
  ::selection { background: #2B5ACF; color: #fff; }
  @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  @keyframes pulse { 0% { r: 8; opacity: 0.55; } 100% { r: 22; opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    html { scroll-behavior: auto; }
  }
  .starfield { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .page { position: relative; z-index: 1; }

  .topnav {
    position: sticky; top: 0; z-index: 50;
    background: rgba(38,38,36,0.88); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-soft);
    padding: 14px 5vw; display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
  }
  .topnav .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; font-weight: 700; font-size: 16px; color: var(--text); }
  .topnav .orb { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--blue); display: grid; place-items: center; flex: none; }
  .topnav .orb i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); }
  .topnav a.navlink { font-size: 14.5px; color: var(--text-2); padding: 4px 2px; border-bottom: 2px solid transparent; }
  .topnav a.navlink:hover { color: var(--cyan); text-decoration: none; border-bottom-color: var(--cyan); }
  .langtoggle { display: flex; border: 1px solid var(--gold); border-radius: 999px; overflow: hidden; }
  .langtoggle button {
    font-family: 'Space Grotesk', 'Noto Sans TC'; background: transparent; color: var(--gold);
    border: none; padding: 6px 16px; font-size: 13.5px; cursor: pointer; letter-spacing: 0.05em;
  }
  .langtoggle button.active { background: var(--gold); color: #262624; font-weight: 700; }

  .hero { position: relative; overflow: hidden; padding: 100px 8vw 120px; border-bottom: 1px solid var(--border-soft); }
  .hero .kicker span { font-family: 'Space Grotesk'; letter-spacing: 0.25em; font-size: 12.5px; color: var(--blue); text-transform: uppercase; }
  .hero h1 { font-family: 'Noto Serif TC', serif; font-weight: 600; font-size: clamp(36px, 5.4vw, 68px); line-height: 1.18; margin: 14px 0; letter-spacing: 0.08em; }
  .hero .sub { font-family: 'Space Grotesk'; font-size: clamp(16px, 1.9vw, 22px); font-weight: 300; color: var(--text-3); margin: 0 0 28px; letter-spacing: 0.04em; }
  .hero .lede { max-width: 660px; font-size: 16px; color: var(--text-2); margin: 0; }
  .ridge { position: absolute; left: 0; right: 0; bottom: -2px; width: 100%; height: 150px; pointer-events: none; }
  .stat-strip { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 38px; }
  .stat { border: 1px solid var(--border); border-radius: 12px; padding: 14px 22px; background: rgba(48,48,46,0.6); min-width: 140px; }
  .stat b { display: block; font-family: 'Space Grotesk'; font-size: 24px; font-weight: 500; color: var(--cyan); line-height: 1.25; }
  .stat span { font-size: 12.5px; color: var(--muted); }

  section.block { padding: 90px 8vw; border-bottom: 1px solid var(--border-soft); position: relative; scroll-margin-top: 70px; }
  .sec-head { display: flex; align-items: baseline; gap: 18px; margin-bottom: 14px; flex-wrap: wrap; }
  .sec-head .no { font-family: 'Space Grotesk'; font-size: 15px; color: var(--gold); letter-spacing: 0.2em; }
  .sec-head h2 { font-family: 'Noto Serif TC', serif; font-size: clamp(26px, 3.2vw, 36px); font-weight: 600; margin: 0; }
  .sec-head h2 small { font-family: 'Space Grotesk'; font-weight: 300; font-size: 0.55em; color: var(--muted); margin-left: 10px; }
  .sec-intro { max-width: 700px; color: var(--text-3); margin: 0 0 42px; font-size: 15.5px; }

  /* value chain flow */
  .chainflow { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
  .seg-card { border: 1px solid var(--border); border-radius: 18px; padding: 26px 24px; background: linear-gradient(160deg, var(--bg-2), #2B2A28); border-top: 3px solid var(--seg, var(--gold)); }
  .seg-card .glyph { font-size: 26px; margin-bottom: 10px; }
  .seg-card h3 { font-size: 17px; font-weight: 700; margin: 0 0 2px; }
  .seg-card .en { font-family: 'Space Grotesk'; font-size: 11.5px; color: var(--blue); letter-spacing: 0.06em; margin-bottom: 10px; }
  .seg-card p { font-size: 13.5px; color: var(--text-3); margin: 0; }
  .seg-card .cnt { font-family: 'Space Grotesk'; font-size: 13px; color: var(--seg, var(--gold)); margin-top: 12px; }

  /* map layout — full width */
  .maparea { display: block; }
  .mapbox { border: 1px solid var(--border); border-radius: 24px; background: linear-gradient(170deg, rgba(48,48,46,0.7), rgba(38,38,36,0.4)); padding: 14px; position: relative; }
  #twmap { height: 620px; border-radius: 14px; background: #1F1E1C; }
  @media (max-width: 900px) { #twmap { height: 460px; } }
  /* OSM tiles → deep-space dark mode */
  #twmap .leaflet-tile-pane { filter: invert(100%) hue-rotate(190deg) brightness(0.86) contrast(0.9) saturate(0.5); }
  #twmap .leaflet-control-attribution { background: rgba(38,38,36,0.85); color: var(--muted); font-size: 10.5px; }
  #twmap .leaflet-control-attribution a { color: var(--cyan); }
  #twmap .leaflet-control-zoom a { background: var(--bg-2); color: var(--text-2); border-color: var(--border); }
  #twmap .leaflet-control-zoom a:hover { background: var(--bg-3); color: var(--cyan); }
  .cluster-label { background: transparent; border: none; box-shadow: none; }
  .cluster-label div {
    font-family: 'Noto Sans TC'; font-size: 12.5px; font-weight: 700; color: var(--text);
    text-shadow: 0 0 4px #1F1E1C, 0 0 8px #1F1E1C, 0 1px 2px #1F1E1C; white-space: nowrap;
  }
  .cluster-label.sel div { color: var(--gold); }
  .mapfallback { display: grid; place-items: center; height: 100%; color: var(--muted); font-size: 14px; text-align: center; padding: 20px; }
  /* pie markers coloured by industry segment */
  .pie-marker { background: none; border: none; }
  .pie-marker .pie {
    box-sizing: border-box; border-radius: 50%; border-style: solid; cursor: pointer;
    box-shadow: 0 0 0 1px rgba(31,30,28,0.55); transition: opacity .2s;
  }
  .pie-marker .pie.launch { animation: ringpulse 2.2s ease-out infinite; }
  @keyframes ringpulse {
    0%   { box-shadow: 0 0 0 1px rgba(31,30,28,0.55), 0 0 0 0 rgba(255,122,92,0.55); }
    100% { box-shadow: 0 0 0 1px rgba(31,30,28,0.55), 0 0 0 13px rgba(255,122,92,0); }
  }

  /* filters */
  .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
  .fbtn {
    font-family: inherit; font-size: 13.5px; cursor: pointer; border-radius: 999px; padding: 7px 16px;
    background: transparent; border: 1px solid var(--border); color: var(--text-3);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .fbtn i { width: 8px; height: 8px; border-radius: 50%; background: var(--seg, var(--muted)); flex: none; }
  .fbtn.active { border-color: var(--seg, var(--text)); color: var(--text); background: rgba(255,255,255,0.04); }

  /* org list panel — full-width grid below map */
  .panel { margin-top: 30px; }
  .panel .ptitle { font-family: 'Noto Serif TC', serif; font-size: 24px; font-weight: 600; margin: 0 0 4px; }
  .panel .psub { font-family: 'Space Grotesk'; font-size: 12.5px; color: var(--muted); letter-spacing: 0.08em; margin-bottom: 22px; }
  .orgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }
  .org { border: 1px solid var(--border); border-left: 3px solid var(--seg, var(--gold)); border-radius: 14px; background: var(--bg-2); padding: 18px 22px; display: flex; flex-direction: column; }
  .org .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .org b { font-size: 16px; }
  .org .en { font-family: 'Space Grotesk'; font-size: 12px; color: var(--blue); }
  .org .loc { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .org p { font-size: 13.5px; color: var(--text-3); margin: 6px 0 0; }
  .org .foot { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .org .segtag { display: inline-block; font-size: 11.5px; color: var(--seg, var(--gold)); border: 1px solid var(--seg, var(--gold)); border-radius: 999px; padding: 1px 10px; }
  .org .site {
    margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-family: 'Space Grotesk', 'Noto Sans TC';
    font-size: 12.5px; font-weight: 500; color: #262624; background: var(--gold); border-radius: 8px; padding: 5px 13px; white-space: nowrap;
  }
  .org .site:hover { background: #FFD666; text-decoration: none; box-shadow: 0 0 16px rgba(255,197,61,0.4); }

  /* satellite anatomy (exploded view) */
  .satarea { display: grid; grid-template-columns: minmax(340px, 620px) 1fr; gap: 34px; align-items: start; }
  @media (max-width: 980px) { .satarea { grid-template-columns: 1fr; } }
  .satbox { border: 1px solid var(--border); border-radius: 24px; background: linear-gradient(170deg, rgba(48,48,46,0.7), rgba(38,38,36,0.4)); padding: 18px; }
  .satbox svg { width: 100%; height: auto; display: block; }
  .sat-line { stroke: #6FA7D9; stroke-width: 1.4; fill: none; stroke-linecap: round; }
  .sat-fill { fill: #2E3A4A; stroke: #6FA7D9; stroke-width: 1.4; }
  .sat-panel { fill: #24405C; stroke: #6FD4FF; stroke-width: 1.2; }
  .sat-grid { stroke: #6FD4FF; stroke-width: 0.5; opacity: 0.5; }
  .leader { stroke: #57554F; stroke-width: 1; stroke-dasharray: 3 4; }
  .hotspot { cursor: pointer; }
  .hotspot circle.num { fill: #262624; stroke: var(--rc, #6FD4FF); stroke-width: 1.6; transition: all .15s; }
  .hotspot text { font-family: 'Space Grotesk', 'Noto Sans TC'; font-size: 13px; font-weight: 700; fill: var(--rc, #6FD4FF); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .hotspot:hover circle.num { fill: var(--rc, #6FD4FF); }
  .hotspot:hover text { fill: #262624; }
  .hotspot.sel circle.num { fill: var(--rc, #6FD4FF); r: 13; }
  .hotspot.sel text { fill: #262624; }
  .comp-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .cchip {
    font-family: inherit; font-size: 12.5px; cursor: pointer; border-radius: 999px; padding: 6px 13px;
    background: transparent; border: 1px solid var(--border); color: var(--text-3);
    display: inline-flex; align-items: center; gap: 7px;
  }
  .cchip i { width: 8px; height: 8px; border-radius: 50%; background: var(--rc, var(--muted)); flex: none; }
  .cchip.sel { border-color: var(--rc, var(--text)); color: var(--text); background: rgba(255,255,255,0.04); }
  .ratelegend { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 22px; font-size: 13px; color: var(--text-3); }
  .ratelegend span { display: inline-flex; align-items: center; gap: 7px; }
  .ratelegend i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .comp-panel .badge { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--rc, var(--muted)); color: var(--rc, var(--muted)); border-radius: 999px; padding: 4px 14px; font-size: 12.5px; margin-bottom: 14px; }
  .comp-panel .badge i { width: 8px; height: 8px; border-radius: 50%; background: var(--rc, var(--muted)); }
  .comp-panel .overview { font-size: 14.5px; color: var(--text-2); margin: 0 0 18px; max-width: 640px; }
  .firm { border: 1px solid var(--border); border-left: 3px solid var(--rc, var(--muted)); border-radius: 14px; background: var(--bg-2); padding: 15px 20px; margin-bottom: 12px; }
  .firm b { font-size: 15px; }
  .firm .en { font-family: 'Space Grotesk'; font-size: 11.5px; color: var(--blue); margin-left: 8px; }
  .firm p { font-size: 13px; color: var(--text-3); margin: 4px 0 0; }
  .gapnote { border: 1px dashed var(--coral); border-radius: 14px; padding: 14px 20px; font-size: 13px; color: var(--text-3); margin-top: 4px; }
  .gapnote b { color: var(--coral); }

  /* missions strip */
  .missions { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .mission { border: 1px solid var(--border); border-radius: 16px; padding: 22px 24px; background: var(--bg-2); }
  .mission .yr { font-family: 'Space Grotesk'; font-size: 13px; color: var(--gold); letter-spacing: 0.14em; }
  .mission b { display: block; font-size: 16.5px; margin: 6px 0 4px; }
  .mission p { font-size: 13px; color: var(--text-3); margin: 0; }

  .disclaimer {
    border: 1px solid var(--border); border-left: 3px solid var(--gold); border-radius: 12px;
    background: rgba(255,197,61,0.05); padding: 20px 26px; font-size: 14px; color: var(--text-3); max-width: 900px;
  }
  footer { position: relative; padding: 70px 8vw 55px; text-align: center; }
  footer .t { font-family: 'Noto Serif TC', serif; font-weight: 600; font-size: 22px; margin-bottom: 8px; }
  footer .s { font-family: 'Space Grotesk'; font-size: 12px; letter-spacing: 0.2em; color: var(--muted); }
  footer .links { margin: 20px 0 0; font-size: 13.5px; color: var(--muted); }
</style>
</head>

    <path d="M0,180 L0,146 C160,138 260,104 380,100 C480,96 540,72 620,70 C710,68 780,92 880,96 C1000,101 1120,84 1240,96 C1320,104 1390,118 1440,124 L1440,180 Z" fill="#262624"/>

<section class="block" id="anatomy">
  <div class="sec-head"><span class="no">03</span><h2><span data-t="secA"></span><small data-t="secAen"></small></h2></div>
  <p class="sec-intro" data-t="secAintro"></p>
  <div class="ratelegend">
    <span><i style="background:#35D0A0"></i><span data-t="r_strong"></span></span>
    <span><i style="background:#FFC53D"></i><span data-t="r_mid"></span></span>
    <span><i style="background:#FF7A5C"></i><span data-t="r_gap"></span></span>
  </div>
  <div class="satarea">
    <div class="satbox">
      <svg id="satsvg" viewBox="0 0 560 500" role="img" aria-label="LEO satellite exploded view">
        <!-- earth arc -->
        <path d="M-20,540 Q280,430 580,540" fill="none" stroke="#2B5ACF" stroke-width="1.2" opacity="0.5"/>
        <path d="M-20,560 Q280,455 580,560" fill="#1F2A3A" opacity="0.5"/>

        <!-- left solar wing -->
        <g id="g-solar">
          <rect class="sat-panel" x="28" y="196" width="52" height="64" rx="3"/>
          <rect class="sat-panel" x="86" y="196" width="52" height="64" rx="3"/>
          <rect class="sat-panel" x="144" y="196" width="52" height="64" rx="3"/>
          <line class="sat-grid" x1="54" y1="196" x2="54" y2="260"/><line class="sat-grid" x1="112" y1="196" x2="112" y2="260"/><line class="sat-grid" x1="170" y1="196" x2="170" y2="260"/>
          <line class="sat-grid" x1="28" y1="228" x2="196" y2="228"/>
          <line class="sat-line" x1="196" y1="228" x2="238" y2="228"/>
          <!-- right solar wing -->
          <rect class="sat-panel" x="364" y="196" width="52" height="64" rx="3"/>
          <rect class="sat-panel" x="422" y="196" width="52" height="64" rx="3"/>
          <rect class="sat-panel" x="480" y="196" width="52" height="64" rx="3"/>
          <line class="sat-grid" x1="390" y1="196" x2="390" y2="260"/><line class="sat-grid" x1="448" y1="196" x2="448" y2="260"/><line class="sat-grid" x1="506" y1="196" x2="506" y2="260"/>
          <line class="sat-grid" x1="364" y1="228" x2="532" y2="228"/>
          <line class="sat-line" x1="322" y1="228" x2="364" y2="228"/>
        </g>

        <!-- bus -->
        <g id="g-bus">
          <rect class="sat-fill" x="238" y="176" width="84" height="104" rx="6"/>
          <line class="sat-grid" x1="238" y1="176" x2="322" y2="280"/>
          <line class="sat-grid" x1="322" y1="176" x2="238" y2="280"/>
          <line class="sat-grid" x1="238" y1="228" x2="322" y2="228"/>
        </g>

        <!-- 3 payload dish -->
        <g id="g-dish">
          <path class="sat-fill" d="M244,96 Q280,66 316,96 Q280,120 244,96 Z"/>
          <line class="sat-line" x1="280" y1="96" x2="280" y2="128"/>
          <circle class="sat-fill" cx="280" cy="88" r="5"/>
          <line class="leader" x1="280" y1="128" x2="280" y2="176"/>
        </g>

        <!-- 2 ADCS cluster -->
        <g id="g-adcs">
          <rect class="sat-fill" x="164" y="108" width="26" height="22" rx="3"/>

/* Leaflet map over OpenStreetMap tiles */
let map = null, markerLayer = null;

function initMap() {
  const el = document.getElementById('twmap');
  if (typeof L === 'undefined') {
    el.innerHTML = '<div class="mapfallback">Map library failed to load.<br>請檢查網路連線後重新整理。</div>';
    return;
  }
  map = L.map('twmap', { scrollWheelZoom: false, zoomSnap: 0.25, attributionControl: true });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors',
  }).addTo(map);
  markerLayer = L.layerGroup().addTo(map);
  const fit = () => map.fitBounds([[21.85, 119.95], [25.40, 122.05]], { padding: [20, 20] });
  fit();
  // full-width container: recompute size after layout settles and on resize
  requestAnimationFrame(() => { map.invalidateSize(); fit(); });
  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { map.invalidateSize(); fit(); }, 200); });
}

const SEG_ORDER = ['agency', 'launch', 'satellite', 'ground', 'service'];

// build a conic-gradient string from the segment mix at a city
function segGradient(orgsHere) {
  const counts = {};
  orgsHere.forEach(o => { counts[o.seg] = (counts[o.seg] || 0) + 1; });
  const total = orgsHere.length || 1;
  let acc = 0;
  const stops = [];
  SEG_ORDER.forEach(sk => {
    if (!counts[sk]) return;
    const start = (acc / total) * 360;
    acc += counts[sk];
    const end = (acc / total) * 360;
    stops.push(`${SEGS[sk].color} ${start}deg ${end}deg`);
  });
  return stops.length > 1 ? `conic-gradient(${stops.join(',')})` : (stops[0] ? stops[0].split(' ')[0] : '#6FD4FF');
}

function renderMap() {
  if (!map || !markerLayer) return;
  markerLayer.clearLayers();
  Object.entries(CITIES).forEach(([key, c]) => {
    const orgsHere = ORGS.filter(o => o.city === key);
    const match = selSeg ? orgsHere.some(o => o.seg === selSeg) : true;
    const isSel = selCity === key;
    const r = Math.min(8 + orgsHere.length * 1.6, 18);
    const d = Math.round(r * 2);
    const bg = segGradient(orgsHere);          // coloured by industry segment(s)
    const bw = isSel ? 3 : 1.5;
    const bc = isSel ? '#FFC53D' : '#1F1E1C';
    const op = match ? 1 : 0.28;
    const icon = L.divIcon({
      className: 'pie-marker',
      html: `<div class="pie${key === 'pingtung' ? ' launch' : ''}" style="width:${d}px;height:${d}px;` +
            `background:${bg};border-color:${bc};border-width:${bw}px;opacity:${op};"></div>`,
      iconSize: [d, d], iconAnchor: [d / 2, d / 2],
    });
    const marker = L.marker([c.lat, c.lng], { icon, keyboard: true, title: lang === 'zh' ? c.zh : c.en });
    marker.on('click', () => { selCity = (selCity === key ? null : key); update(); });
    marker.bindTooltip(
      `<div>${lang === 'zh' ? c.zh : c.en} · ${orgsHere.length}</div>`,
      { permanent: true, direction: c.labelDir || 'right',
        offset: c.labelDir === 'top' ? [0, -(r + 4)] : [c.labelDir === 'left' ? -(r + 4) : (r + 4), 0],
        className: 'cluster-label' + (isSel ? ' sel' : ''), opacity: match ? 1 : 0.35 }
    );
    markerLayer.addLayer(marker);
  });
}

    const b = document.createElement('button');
    b.className = 'cchip' + (selComp === c.id ? ' sel' : '');
    b.style.setProperty('--rc', RATES[c.rate].color);
    b.innerHTML = `<i></i>${c.no}. ${lang === 'zh' ? c.zh : c.en}`;
    b.onclick = () => { selComp = c.id; update(); };
    chips.appendChild(b);
  });

  const c = COMPS.find(x => x.id === selComp);
  const rc = RATES[c.rate].color;
  document.getElementById('ctitle').textContent = `${c.no}. ${lang === 'zh' ? c.zh : c.en}`;
  document.getElementById('csub').textContent = lang === 'zh' ? c.en : c.zh;
  document.getElementById('cbadge').innerHTML =
    `<span class="badge" style="--rc:${rc}"><i></i>${lang === 'zh' ? RATES[c.rate].zh : RATES[c.rate].en}</span>`;
  document.getElementById('coverview').textContent = lang === 'zh' ? c.ozh : c.oen;
  const fl = document.getElementById('cfirms');
  fl.innerHTML = `<div class="psub" style="margin-bottom:12px;">${t('firms_t')}</div>`;
  c.firms.forEach(f => {
    const d = document.createElement('div');
    d.className = 'firm'; d.style.setProperty('--rc', rc);
    d.innerHTML = `<b>${lang === 'zh' ? f.zh : f.en}</b><span class="en">${lang === 'zh' ? f.en : f.zh}</span>` +
      `<p>${lang === 'zh' ? f.dzh : f.den}</p>`;
    fl.appendChild(d);
  });
  if (c.gzh) {
    const gp = document.createElement('div');
    gp.className = 'gapnote';
    gp.innerHTML = `<b>${lang === 'zh' ? '缺口' : 'Gap'}</b> — ${lang === 'zh' ? c.gzh : c.gen}`;
    fl.appendChild(gp);
  }
}

function renderMissions() {
  const el = document.getElementById('missionlist');
  el.innerHTML = '';
  MISSIONS.forEach(m => {
    const d = document.createElement('div');
    d.className = 'mission';
    d.innerHTML = `<span class="yr">${m.yr}</span><b>${lang==='zh'?m.zh:m.en}</b>` +
      `<p>${lang==='zh'?m.dzh:m.den}</p>`;
    el.appendChild(d);
  });
}

function update() {
  renderStatic(); renderChain(); renderFilters(); renderMap(); renderPanel(); renderAnatomy(); renderMissions();
}


function setLang(l) {
  lang = l; localStorage.setItem('vc-lang', l);
  const url = new URL(location); url.searchParams.set('lang', l); history.replaceState(null, '', url);
  update();
}

initMap();
update();

/* starfield */
(function () {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const host = document.getElementById('starfield');
  const colors = ['#ECEAE5', '#ECEAE5', '#6FD4FF', '#FFC53D'];
  let s = 7;
  const rand = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 100; i++) {
    const d = document.createElement('div');
    const size = rand() < 0.15 ? 2.5 : rand() < 0.5 ? 1.5 : 1;
    d.style.cssText = 'position:absolute;border-radius:50%;' +
      'left:' + (rand() * 100).toFixed(2) + '%;top:' + (rand() * 100).toFixed(2) + '%;' +
      'width:' + size + 'px;height:' + size + 'px;' +
      'background:' + colors[Math.floor(rand() * colors.length)] + ';' +
      'animation:twinkle ' + (2 + rand() * 3).toFixed(1) + 's ease-in-out ' + (rand() * 3).toFixed(1) + 's infinite;';
    frag.appendChild(d);
  }
  host.appendChild(frag);
})();
</script>
