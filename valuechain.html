/* ===================== state & render ===================== */
let lang = localStorage.getItem('vc-lang') || (new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'zh');
let selCity = null, selSeg = null;

function t(k) { return I18N[lang][k] || ''; }

function renderStatic() {
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant-TW' : 'en';
  document.querySelectorAll('[data-t]').forEach(el => {
    const v = t(el.getAttribute('data-t'));
    if (el.getAttribute('data-t') === 'title') el.innerHTML = v.replace('\n', '<br>');
    else el.textContent = v;
  });
  document.getElementById('btn-zh').classList.toggle('active', lang === 'zh');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('disc').innerHTML = t('disc');
}

function renderChain() {
  const el = document.getElementById('chainflow');
  el.innerHTML = '';
  Object.entries(SEGS).forEach(([key, s]) => {
    const n = ORGS.filter(o => o.seg === key).length;
    const d = document.createElement('div');
    d.className = 'seg-card'; d.style.setProperty('--seg', s.color);
    d.innerHTML = `<div class="glyph">${s.glyph}</div><h3>${lang==='zh'?s.zh:s.en}</h3>` +
      `<div class="en">${lang==='zh'?s.en:s.zh}</div>` +
      `<p>${lang==='zh'?s.dzh:s.den}</p>` +
      `<div class="cnt">${n} ${lang==='zh'?'個機構':'entries'}</div>`;
    el.appendChild(d);
  });
}

function renderFilters() {
  const el = document.getElementById('filters');
  el.innerHTML = '';
  const all = document.createElement('button');
  all.className = 'fbtn' + (selSeg === null ? ' active' : '');
  all.innerHTML = `<i style="background:var(--text-3)"></i>${t('all')}`;
  all.onclick = () => { selSeg = null; update(); };
  el.appendChild(all);
  Object.entries(SEGS).forEach(([key, s]) => {
    const b = document.createElement('button');
    b.className = 'fbtn' + (selSeg === key ? ' active' : '');
    b.style.setProperty('--seg', s.color);
    b.innerHTML = `<i></i>${lang==='zh'?s.zh:s.en}`;
    b.onclick = () => { selSeg = (selSeg === key ? null : key); selCity = null; update(); };
    el.appendChild(b);
  });
}

/* Leaflet map over OpenStreetMap tiles */
let map = null, markerLayer = null;

function initMap() {
  const el = document.getElementById('twmap');
  if (typeof L === 'undefined') {
    el.innerHTML = '<div class="mapfallback">Map library failed to load.<br>請檢查網路連線後重新整理。</div>';
    return;
  }
  map = L.map('twmap', { scrollWheelZoom: false, zoomSnap: 0.25, attributionControl: true });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors',
  }).addTo(map);
  markerLayer = L.layerGroup().addTo(map);
  map.fitBounds([[21.85, 119.95], [25.40, 122.05]]);
}

function renderMap() {
  if (!map || !markerLayer) return;
  markerLayer.clearLayers();
  Object.entries(CITIES).forEach(([key, c]) => {
    const orgsHere = ORGS.filter(o => o.city === key);
    const match = selSeg ? orgsHere.some(o => o.seg === selSeg) : true;
    const isSel = selCity === key;
    const r = Math.min(8 + orgsHere.length * 1.6, 18);
    const baseColor = key === 'pingtung' ? '#FF7A5C' : '#6FD4FF';
    const marker = L.circleMarker([c.lat, c.lng], {
      radius: r,
      color: isSel ? '#FFC53D' : '#262624',
      weight: isSel ? 3 : 1.5,
      fillColor: isSel ? '#FFC53D' : baseColor,
      fillOpacity: match ? 0.85 : 0.2,
      opacity: match ? 1 : 0.3,
    });
    marker.on('click', () => { selCity = (selCity === key ? null : key); update(); });
    marker.bindTooltip(
      `<div>${lang === 'zh' ? c.zh : c.en} · ${orgsHere.length}</div>`,
      { permanent: true, direction: c.labelDir || 'right',
        offset: c.labelDir === 'top' ? [0, -(r + 4)] : [c.labelDir === 'left' ? -(r + 4) : (r + 4), 0],
        className: 'cluster-label' + (isSel ? ' sel' : ''), opacity: match ? 1 : 0.35 }
    );
    markerLayer.addLayer(marker);
    // glow ring for the national launch site
    if (key === 'pingtung') {
      markerLayer.addLayer(L.circleMarker([c.lat, c.lng], {
        radius: r + 7, color: '#FF7A5C', weight: 1.2, fill: false, opacity: match ? 0.7 : 0.2, interactive: false,
      }));
    }
  });
}

function renderPanel() {
  const title = document.getElementById('ptitle');
  const sub = document.getElementById('psub');
  const list = document.getElementById('orgs');
  let orgs = ORGS;
  if (selCity) orgs = orgs.filter(o => o.city === selCity);
  if (selSeg) orgs = orgs.filter(o => o.seg === selSeg);
  if (selCity) {
    const c = CITIES[selCity];
    title.textContent = lang === 'zh' ? c.zh : c.en;
    sub.textContent = t('panel_sub_city').replace('{n}', orgs.length);
  } else if (selSeg) {
    title.textContent = lang === 'zh' ? SEGS[selSeg].zh : SEGS[selSeg].en;
    sub.textContent = t('panel_sub_seg').replace('{n}', orgs.length);
  } else {
    title.textContent = t('panel_all');
    sub.textContent = t('panel_sub_all').replace('{n}', ORGS.length);
  }
  list.innerHTML = '';
  orgs.forEach(o => {
    const s = SEGS[o.seg], c = CITIES[o.city];
    const d = document.createElement('div');
    d.className = 'org'; d.style.setProperty('--seg', s.color);
    d.innerHTML = `<div class="head"><b>${lang==='zh'?o.zh:o.en}</b>` +
      `<span class="en">${lang==='zh'?o.en:o.zh}</span>` +
      `<span class="loc">📍 ${lang==='zh'?c.zh:c.en}</span></div>` +
      `<p>${lang==='zh'?o.dzh:o.den}</p>` +
      `<span class="segtag">${s.glyph} ${lang==='zh'?s.zh:s.en}</span>`;
    list.appendChild(d);
  });
}

function renderMissions() {
  const el = document.getElementById('missionlist');
  el.innerHTML = '';
  MISSIONS.forEach(m => {
    const d = document.createElement('div');
    d.className = 'mission';
    d.innerHTML = `<span class="yr">${m.yr}</span><b>${lang==='zh'?m.zh:m.en}</b>` +
      `<p>${lang==='zh'?m.dzh:m.den}</p>`;
    el.appendChild(d);
  });
}

function update() {
  renderStatic(); renderChain(); renderFilters(); renderMap(); renderPanel(); renderMissions();
}


function setLang(l) {
  lang = l; localStorage.setItem('vc-lang', l);
  const url = new URL(location); url.searchParams.set('lang', l); history.replaceState(null, '', url);
  update();
}

initMap();
update();

/* starfield */
(function () {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const host = document.getElementById('starfield');
  const colors = ['#ECEAE5', '#ECEAE5', '#6FD4FF', '#FFC53D'];
  let s = 7;
  const rand = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 100; i++) {
    const d = document.createElement('div');
    const size = rand() < 0.15 ? 2.5 : rand() < 0.5 ? 1.5 : 1;
    d.style.cssText = 'position:absolute;border-radius:50%;' +
      'left:' + (rand() * 100).toFixed(2) + '%;top:' + (rand() * 100).toFixed(2) + '%;' +
      'width:' + size + 'px;height:' + size + 'px;' +
      'background:' + colors[Math.floor(rand() * colors.length)] + ';' +
      'animation:twinkle ' + (2 + rand() * 3).toFixed(1) + 's ease-in-out ' + (rand() * 3).toFixed(1) + 's infinite;';
    frag.appendChild(d);
  }
  host.appendChild(frag);
})();
</script>
